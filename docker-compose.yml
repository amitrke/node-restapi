version: "3.9"
services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/code
      - logvolume01:/var/log
      - vs-server:/root/.vscode-server/extensions
    networks: 
      - dockerlan
    depends_on:
      - db
    links:
      - db
  db:
    container_name: mongo-dev
    image: mongo:4.2
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_DATABASE=auth
      - MONGO_INITDB_ROOT_PASSWORD=pass
    networks: 
      - dockerlan
    ports:
      - '27017:27017'
    volumes: 
      - ./data:/data/db
volumes:
  logvolume01: {}
  vs-server: {}

networks:
  dockerlan:
    driver: bridge